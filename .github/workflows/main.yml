name: Installed artifacts
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: artifacts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    timeout-minutes: 45
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.12']
    steps:
      - uses: actions/checkout@v7
        with:
          path: project
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: Laboratory-for-Energy-Systems-Analysis/carculator_utils
          ref: ${{ vars.CARCULATOR_UTILS_REF || 'master' }}
          path: carculator_utils
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Build, install, check resources, and test artifacts
        run: python carculator_utils/scripts/verify_installation.py --repositories carculator_utils project --output verification --run-tests
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: verification-${{ matrix.os }}-${{ matrix.python }}
          path: |
            verification/report.json
            verification/installation.log
            verification/*-freeze.txt
            verification/*-tests.xml
          if-no-files-found: error
